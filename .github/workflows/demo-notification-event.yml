name: Demo Notification Event

on:
  repository_dispatch:
    types: [demo-notification-event]

permissions:
  contents: write

jobs:

  update-database:

    runs-on: ubuntu-latest
    
    steps:

      - name: Check out private scripts repository
        uses: actions/checkout@v4
        with:
          repository: produke3d/scripts
          ref: master
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: scripts
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Handle External Notification Event
        run: node scripts/process-demos.js '${{ toJSON(github.event.client_payload.demos) }}'

