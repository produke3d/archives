name: Demo Notification Event

run-name: ${{ inputs.sender }} Demo Notification

on:

  workflow_dispatch:

    inputs:

      sender:
        description: "Notification sender"
        required: true
        options:
          - NukemNet
          - AtomicLauncher

      demos:
        description: "JSON array containing demo filenames"
        required: true
        type: string

jobs:

  demo-notification-event:

    name: Demo Notification Event

    runs-on: ubuntu-latest

    steps:

      - name: Check out private scripts repository
        uses: actions/checkout@v4
        with:
          repository: produke3d/scripts
          ref: master
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: scripts
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Handle Demo Notification Event
        env:
          SENDER: ${{ inputs.sender }}
          DEMOS: ${{ inputs.demos }}
        run: node scripts/handle-notification-event.js