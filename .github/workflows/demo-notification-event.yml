name: Demo Notification Event

on:

  workflow_dispatch:

    inputs:

      sender:
        description: "Notification sender (e.g., 'nukemnet' or 'atomiclauncher')"
        required: true
        type: string

      demos:
        description: "JSON array containing demo filenames"
        required: true
        type: string

jobs:

  demo-notification-event:

    runs-on: ubuntu-latest

    steps:

      - name: Check out private scripts repository
        uses: actions/checkout@v4
        with:
          repository: produke3d/scripts
          ref: master
          token: ${{ secrets.SCRIPTS_TOKEN }}
          path: scripts
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Handle External Notification Event
        run: node scripts/handle-notification-event.js "${{ inputs.sender }}" "${{ inputs.demos }}"